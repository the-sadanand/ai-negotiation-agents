
services:

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    hostname: ollama
    healthcheck:
      # USE "ollama list" — it's the ONLY reliable healthcheck for this image
      # It connects to the Ollama server internally, no external tools needed
      test: ["CMD", "ollama", "list"]
      # Check every 10 seconds
      interval: 10s
      # Allow 5 seconds for the command to complete
      timeout: 5s
      # Allow 10 failures before marking unhealthy (gives Ollama time to boot)
      retries: 10
      # Ignore failures for the first 30 seconds (Ollama needs time to initialize)
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    restart: unless-stopped

volumes:
  ollama_data: