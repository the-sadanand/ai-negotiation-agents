# Docker Compose config — orchestrates the full system
version: '3.8'

services:

  # Ollama LLM service — runs the Llama 3 model locally
  ollama:
    image: ollama/ollama          # Official Ollama image
    ports:
      - "11434:11434"             # Ollama API port
    volumes:
      - ollama_data:/root/.ollama # Persist downloaded models
    hostname: ollama              # Other containers reach it as 'ollama'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # FastAPI backend — our negotiation API
  api:
    build:
      context: .                  # Build from project root
      dockerfile: Dockerfile      # Using our Dockerfile
    ports:
      - "8000:8000"               # API accessible on port 8000
    depends_on:
      ollama:
        condition: service_healthy # Wait for Ollama to be ready
    volumes:
      - ./data:/app/data          # Mount data/ for trade_positions.json
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434  # Tell API where Ollama is
    restart: unless-stopped

volumes:
  ollama_data:                    # Named volume for model persistence